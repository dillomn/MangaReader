services:
  mangva:
    build: .
    image: mangva:latest
    container_name: mangva
    ports:
      # host:container — point your Cloudflare Tunnel at http://localhost:3001
      - "3001:3001"
    volumes:
      # Named volume holds the live database: user accounts, read progress,
      # announcements, and the auto-generated JWT secret. Persists across
      # container restarts/recreation. Pinned below so the compose project
      # prefix isn't applied (keeps using the pre-existing "mangva-data").
      - mangva-data:/app/data
    # Values come from a .env file next to this file (gitignored) so the
    # Jellyfin URL and any secret are never committed. See .env.example.
    environment:
      - JELLYFIN_URL=${JELLYFIN_URL:-}        # enables Jellyfin login (else local accounts only)
      - JWT_SECRET=${JWT_SECRET:-}            # optional — auto-generated + persisted to the volume if unset
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}  # optional — only if the API is on a different origin
      - TZ=${TZ:-Australia/Sydney}
    restart: unless-stopped

volumes:
  mangva-data:
    name: mangva-data   # pin to the pre-existing volume (avoid compose project prefix)
